group: io.kestra.plugin.databricks
name: "databricks"
title: "Databricks"
description: "Databricks plugin for Kestra"
body: "Orchestrate Databricks from Kestra: create and run jobs or submit ad-hoc runs (notebook, dbt, Spark, SQL, Delta Live Tables, and more), create and delete compute clusters, ask a Genie space a question or continue the conversation, run SQL through the JDBC driver, query Databricks Lakebase (managed Postgres) with a short-lived OAuth credential, manage Unity Catalog catalogs, schemas, tables, volumes and grants (including volume file upload and download), upload and download DBFS files, and run Databricks CLI or SQL CLI commands. Authenticate with a personal access token, an OAuth service principal, or a CLI configuration file."
