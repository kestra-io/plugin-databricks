name: Publish docker images
description: automatically build and publishes the docker images provided by Kestra in directory dockerfiles
permissions:
  contents: read
  pull-requests: write
on:
  push:
    paths:
      - dockerfiles/*
    branches:
      - main
  # Build (and smoke test) a changed Dockerfile on its pull request, without pushing: a merge publishes `latest` directly.
  pull_request:
    paths:
      - dockerfiles/*

jobs:
  changes:
    name: Dockerfile changes
    runs-on: ubuntu-latest
    outputs:
      dockerfiles: ${{ steps.filter.outputs.dockerfiles_files }}
      dockerfiles_changed: ${{ steps.filter.outputs.dockerfiles }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: json
          filters: |
            dockerfiles:
              - added|modified: 'dockerfiles/*.Dockerfile'
      - name: Generate Markdown Summary
        env:
          DOCKERFILES: ${{ steps.filter.outputs.dockerfiles_files }}
        run: |
          echo "New/modified Dockerfiles: $DOCKERFILES" >> $GITHUB_STEP_SUMMARY

  ghcr:
    needs: [changes]
    if: ${{ needs.changes.outputs.dockerfiles_changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: ${{ fromJson(needs.changes.outputs.dockerfiles) }}
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: GHCR Login
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image-tag  # example output: "ghcr.io/kestra-io/pydata:latest"
        env:
          DOCKERFILE: ${{ matrix.image }}
        run: |
          IMAGE=$(basename "$DOCKERFILE" .Dockerfile)
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "image_url=ghcr.io/kestra-io/$IMAGE:latest" >> $GITHUB_OUTPUT
          echo "file=$DOCKERFILE" >> $GITHUB_OUTPUT

      - name: Build Docker image (pull request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.image-tag.outputs.image_url }}
          file: ${{ steps.image-tag.outputs.file }}
          platforms: linux/amd64

      - name: Smoke test (pull request)
        if: github.event_name == 'pull_request' && steps.image-tag.outputs.image == 'databricks-sql-cli'
        env:
          IMAGE_URL: ${{ steps.image-tag.outputs.image_url }}
        run: docker run --rm "$IMAGE_URL" dbsqlcli --help

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image-tag.outputs.image_url }}
          file: ${{ steps.image-tag.outputs.file }}
          platforms: linux/amd64,linux/arm64
